
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Invitación</title>

    <meta property="og:title" content="Nuestra Invitación">
    <meta property="og:description" content="Te invitamos a nuestro evento especial.">
    <meta property="og:image" content="portada.jpg">
    <meta property="og:type" content="https://invitaendigitalweb-svg.github.io/bodabasica/">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Cinzel', serif;
            background-color: #555E3C;
        }

        .fullscreen-wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .envelope-container {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #555E3C;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
            z-index: 10;
        }

        .flap {
            position: absolute;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            backface-visibility: hidden;
        }

        .envelope-flap-top {
            top: 0;
            border-width: 48vh 50vw 0 50vw;
            border-color: #6B764C transparent transparent transparent;
            transform-origin: top;
            z-index: 4;
        }

        .envelope-flap-bottom {
            bottom: 0;
            border-width: 0 50vw 48vh 50vw;
            border-color: transparent transparent #4D5537 transparent;
            transform-origin: bottom;
            z-index: 2;
        }

        .envelope-flap-left {
            top: 0;
            border-width: 50vh 0 50vh 50vw;
            border-color: transparent transparent transparent #59623E;
            z-index: 1;
        }

        .envelope-flap-right {
            top: 0;
            right: 0;
            left: auto;
            border-width: 50vh 50vw 50vh 0;
            border-color: transparent #59623E transparent transparent;
            z-index: 1;
        }

        .center-group {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: opacity 0.3s ease;
        }

        .seal {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .view-text {
            font-size: 13px;
            color: #ffffff;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            background-color: rgba(77, 85, 55, 0.9);
            padding: 8px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .invitation-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease 0.4s;
            z-index: 3;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: #fff;
        }

        .open .envelope-flap-top {
            transform: rotateX(-180deg);
        }

        .open .envelope-flap-bottom {
            transform: rotateX(180deg);
        }

        .open .center-group {
            opacity: 0;
            visibility: hidden;
        }

        .open .invitation-wrapper {
            opacity: 1;
            visibility: visible;
            z-index: 20;
        }

        img {
            width: 100%;
            display: block;
        }

        .espacio-blanco {
            height: 10px;
            background-color: #fff;
        }

        .section-container {
            position: relative;
            width: 100%;
        }

        .btn-ubicacion {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #6B764C;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            min-width: 250px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        /* FOTO */

        .foto-container {
            width: 80%;
            margin: 30px auto;
            overflow: hidden;
            background-color: #fff;
            border-radius: 15px;
        }

        .foto-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .btn-container-ext {
            background-color: #fff;
            padding: 20px 0;
            text-align: center;
        }

        .btn-confirmar {
            display: inline-block;
            background-color: #6B764C;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border-radius: 10px;
            font-size: 18px;
            min-width: 250px;
        }
    </style>
</head>

<body>

<div class="fullscreen-wrapper">

    <div class="envelope-container" id="envelope" onclick="openEnvelope()">

        <!-- SOBRE -->

        <div class="flap envelope-flap-top"></div>
        <div class="flap envelope-flap-left"></div>
        <div class="flap envelope-flap-right"></div>
        <div class="flap envelope-flap-bottom"></div>


        <!-- SELLO -->

        <div class="center-group">

            <img
                src="https://i.imgur.com/37qdJ49.png"
                alt="Sello"
                class="seal"
            >

            <div class="view-text">
                Ver invitación
            </div>

        </div>


        <!-- INVITACIÓN -->

        <div class="invitation-wrapper">

            <!-- PORTADA -->

            <img
                src="portada.jpg"
                alt="Portada"
            >


            <!-- ESPACIO -->

            <div class="espacio-blanco"></div>


            <!-- ORACIÓN -->

            <img
                src="oracion.jpg"
                alt="Oración"
            >


            <!-- CEREMONIA -->

            <div class="section-container">

                <img
                    src="ceremonia.jpg"
                    alt="Ceremonia"
                >

                <a
                    href="https://www.google.com/maps/place/Tizate+Sea+Garden/@20.755375,-105.3704433,15z/data=!4m15!1m8!3m7!1s0x842141843848881d:0xceb115f9117dbb0f!2sTizate+Sea+Garden!8m2!3d20.7554698!4d-105.3707493!10e5!16s%2Fg%2F11fmv9r6gn!3m5!1s0x842141843848881d:0xceb115f9117dbb0f!8m2!3d20.7554698!4d-105.3707493!16s%2Fg%2F11fmv9r6gn?hl=es_419&entry=ttu&g_ep=EgoyMDI1MDgyNS4wIKXMDSoASAFQAw%3D%3D"
                    class="btn-ubicacion"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    VER UBICACIÓN
                </a>

            </div>


            <!-- FOTO ÚNICA -->

            <div class="foto-container">

                <img
                    src="foto.jpg"
                    alt="Foto"
                >

            </div>


            <!-- REGALOS -->

            <img
                src="regalos.jpg"
                alt="Regalos"
            >


            <!-- VESTIMENTA -->

            <img
                src="vestimenta.jpg"
                alt="Vestimenta"
            >


            <!-- CONFIRMACIÓN -->

            <img
                src="confirmacion.jpg"
                alt="Confirmación"
            >


            <!-- BOTÓN FINAL -->

            <div class="btn-container-ext">

                <a
                    href="https://wa.link/ik5r5d"
                    class="btn-confirmar"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    DA CLICK
                </a>

            </div>

        </div>

    </div>

</div>


<script>

    let isOpen = false;

    function openEnvelope() {

        if (!isOpen) {

            isOpen = true;

            document
                .getElementById("envelope")
                .classList
                .add("open");

        }

    }

</script>

</body>
</html>
